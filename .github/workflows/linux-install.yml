name: Linux install

# The one-line Linux installer (website/install.sh), tested on a clean Ubuntu with
# its own "externally managed" Python: install, the command and menu entry, the
# setup and uninstall windows (pictures saved as an artifact), an update, and the
# uninstall leaving nothing behind.

on:
  push:
    branches: [main]
    paths: ["website/install.sh", "src/mygeeky/gui/**", "src/mygeeky/cli.py", ".github/workflows/linux-install.yml",
            ".github/scripts/linux_windows.py"]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What a fresh Ubuntu desktop needs for Qt windows (and a virtual screen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 > /dev/null

      - name: Build this version's wheel
        run: pipx run build --wheel --outdir dist .

      - name: Install with the one-liner (Ubuntu's own Python)
        run: |
          python3 --version
          MYGEEKY_SPEC="$(ls dist/mygeeky-*.whl)" MYGEEKY_NO_LAUNCH=1 sh website/install.sh

      - name: The command, the menu entry and Qt are there
        run: |
          ~/.local/bin/mygeeky --version
          ls ~/.local/share/applications/ | grep -i mygeeky
          grep '^Exec=' ~/.local/share/applications/*mygeeky*.desktop
          xvfb-run -a ~/.local/share/mygeeky-app/venv/bin/python -c "import sys; from PySide6.QtWidgets import QApplication; QApplication(sys.argv); print('Qt opens windows')"

      - name: The setup and uninstall windows on Linux
        run: xvfb-run -a ~/.local/share/mygeeky-app/venv/bin/python .github/scripts/linux_windows.py linux-windows

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-windows
          path: linux-windows/

      - name: Running it again updates in place
        run: MYGEEKY_SPEC="$(ls dist/mygeeky-*.whl)" MYGEEKY_NO_LAUNCH=1 sh website/install.sh

      - name: Uninstalling leaves nothing behind
        run: |
          ~/.local/share/mygeeky-app/venv/bin/python -c "import sys; from mygeeky.gui.setup_wizard import uninstall; print('\n'.join(uninstall(sys.executable)))"
          test ! -e ~/.local/share/mygeeky-app && echo "folder gone"
          test ! -e ~/.local/bin/mygeeky && echo "command gone"
          ! ls ~/.local/share/applications/ 2>/dev/null | grep -qi mygeeky && echo "menu entry gone"
