[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mygeeky"
version = "0.17.3"
description = "Your corner of GitHub: the people, projects and pulse of your field, from your CV, repos and papers. Suggests only; never follows anyone for you."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "github",
    "networking",
    "recommendation",
    "cli",
    "ai-agent-tool",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "keyring>=24.0",
    "platformdirs>=4.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pypdf>=4.0",
    "cryptography>=42",   # private Signals (X25519 + ChaCha20-Poly1305)
    "qrcode>=7.4",        # "Connect your phone" (pure Python)
]

# Qt for the panel is NOT a pip dependency: `mygeeky gui` installs it on first
# use, into a short private folder when this Python's package folder is too
# deep for it (see mygeeky/gui/bootstrap.py). The old extras stay so existing
# `pip install "mygeeky[gui,pdf]"` commands keep working.
[project.optional-dependencies]
pdf = []
gui = []
dev = ["pytest>=7.4"]

[project.scripts]
mygeeky = "mygeeky.cli:entry"
mygeeky-gui = "mygeeky.gui.app:main"
mygeeky-setup = "mygeeky.gui.bootstrap:setup_main"

[project.urls]
Homepage = "https://mygeeky.org"
Source = "https://github.com/AlsammanAlsamman/myGeeKy"
Documentation = "https://github.com/AlsammanAlsamman/myGeeKy/blob/main/docs/GUIDE.md"
Ideas = "https://github.com/AlsammanAlsamman/myGeeKy-ideas"
Issues = "https://github.com/AlsammanAlsamman/myGeeKy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mygeeky = ["py.typed", "data/*.json"]
"mygeeky.gui" = ["assets/*.png", "assets/*.ico"]
