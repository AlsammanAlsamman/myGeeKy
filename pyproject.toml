[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mygeeky"
version = "0.1.1"
description = "Find fellow GitHub geeks who match your CV and repos and are likely to follow back. Suggests only — you always follow manually."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "github",
    "networking",
    "recommendation",
    "cli",
    "ai-agent-tool",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "keyring>=24.0",
    "platformdirs>=4.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.4"]

[project.scripts]
mygeeky = "mygeeky.cli:main"
mygeeky-gui = "mygeeky.gui.app:main"

[project.urls]
Homepage = "https://github.com/AlsammanAlsamman/myGeeKy"
Issues = "https://github.com/AlsammanAlsamman/myGeeKy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mygeeky = ["py.typed"]
"mygeeky.gui" = ["assets/*.png"]
